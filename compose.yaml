name: "${COURSE_PROJECT:-integer-programming-python-or-tools}"
services:
  site:
    build:
      context: .
      dockerfile: .studyforge/images/site/Dockerfile
      target: "${COURSE_NARRATION:-without-narration}"
      args:
        STUDYFORGE_NAMESPACE: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}"
    image: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/integer-programming-python-or-tools-site:5068559d740e-586427a01833-${COURSE_NARRATION:-without-narration}"
    user: "1000:1000"
    command:
      - serve
      - /corpus
      - --published
      - --port
      - "${COURSE_SITE_PORT:-8765}"
    ports:
      - "127.0.0.1:${COURSE_SITE_PORT:-8765}:${COURSE_SITE_PORT:-8765}"
    environment:
      STUDYFORGE_EDITOR_ORIGIN: "http://127.0.0.1:${COURSE_EDITOR_PORT:-8444}"
      STUDYFORGE_EDITOR_BINDS: .studyforge/execution/code=/home/coder/repo/sources;practice=/home/coder/repo/practice
      STUDYFORGE_EDITOR_HEALTH: "http://editor:8080/healthz"
      STUDYFORGE_RUN_SERVICE: runner
      PYTHONDONTWRITEBYTECODE: 1
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${COURSE_SITE_PORT:-8765}/', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    volumes:
      - "code:/corpus/.studyforge/execution/code"
      - "practice:/corpus/practice"
      - "allowed:/corpus/.studyforge/execution/allowed"
      - "progress:/corpus/.studyforge/progress"
    networks:
      - default
      - runs
    restart: "no"
  runner:
    build:
      context: .
      dockerfile: .studyforge/images/runner/Dockerfile
      args:
        RUNNER_PRIMED: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/studyforge-code-toolchain-runner-optimization:node-python-amd64-45b9b7a7864e@sha256:26d6497b169df592e3c94f33163bd1189d11516963c263cbb81ec1c8829d74f8"
    image: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/integer-programming-python-or-tools-runner:5068559d740e-26d6497b169d"
    user: "1000:1000"
    init: true
    volumes:
      - "code:/work/.studyforge/execution/code"
      - "practice:/work/practice"
      - "allowed:/work/.studyforge/execution/allowed:ro"
    labels:
      org.studyforge.binds: =/work
    networks:
      - runs
    depends_on:
      site:
        condition: service_healthy
    restart: "no"
  editor:
    build:
      context: .studyforge/images/editor
      args:
        EDITOR_BASE: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/studyforge-code-toolchain-editor-optimization:node-python-amd64-3c6029efce7f@sha256:b5d2448eef7be3bee3583dfdb859e922e3ccb441934f97d87f591564be98da7f"
    image: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/integer-programming-python-or-tools-editor:5068559d740e-b5d2448eef7b"
    labels:
      org.studyforge.binds: .studyforge/execution/code=/home/coder/repo/sources;practice=/home/coder/repo/practice
    user: "1000:1000"
    read_only: false
    ports:
      - "127.0.0.1:${COURSE_EDITOR_PORT:-8444}:8080"
    environment:
      GRADLE_USER_HOME: /home/coder/.gradle
    command:
      - --auth=none
      - "--bind-addr=0.0.0.0:8080"
      - --extensions-dir=/opt/code-server/extensions
      - --disable-workspace-trust
      - --disable-telemetry
      - --disable-update-check
      - /home/coder/repo
    tmpfs:
      - /home/coder/repo
    volumes:
      - "code:/home/coder/repo/sources"
      - "editor-config:/home/coder/.config"
      - "editor-data:/home/coder/.local"
      - "practice:/home/coder/repo/practice"
    healthcheck:
      test:
        - CMD
        - /usr/lib/code-server/lib/node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3
    restart: "no"
    depends_on:
      site:
        condition: service_healthy
networks:
  runs:
    internal: true
volumes:
  allowed: {}
  code: {}
  editor-config: {}
  editor-data: {}
  practice: {}
  progress: {}
