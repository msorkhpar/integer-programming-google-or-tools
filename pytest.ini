[pytest]
# Shared by the course's own test runs and, because pytest looks upward for this file, by every
# practice and example run the site starts. So it stays quiet: no cache files (the plugin is off),
# and no -q here, which would stack with a command's own -q and hide the "N passed" line.
pythonpath = 00-base
addopts = -p no:cacheprovider
